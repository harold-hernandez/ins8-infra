name: CI

on:
  push:
    branches: ['**']

jobs:
  fmt:
    name: Terraform Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -recursive -check -diff
        working-directory: terraform

  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [ins8-frontend, ins8-tasks]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      # -backend=false: CI has no GCS state bucket credentials and doesn't
      # need any — this only checks the config is internally consistent
      # (types, references, required arguments), the same thing
      # `terraform validate` checked locally before this ever ran in CI.
      - run: terraform init -backend=false -input=false
        working-directory: terraform/envs/${{ matrix.env }}
      - run: terraform validate
        working-directory: terraform/envs/${{ matrix.env }}

  security-scan:
    name: Trivy IaC Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'terraform'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
